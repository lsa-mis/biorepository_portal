name: Accessibility report

# Run on demand from the Actions tab (Accessibility report > Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [axcess-a11y-gate]

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  axcess:
    name: Accessibility report (Axcess)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/biorepository_portal_test
      APP_URL: http://127.0.0.1:3000
      # Scan every public page the crawl can reach. Axcess has no "unlimited"
      # setting, so this is only a guard against a runaway crawl; the portal's
      # public site is about 200 URLs with the sample data.
      AXCESS_MAX_PAGES: 5000
      REPORT_DIR: ${{ github.workspace }}/reports/axcess
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biorepository_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # persist-credentials: false keeps the job token out of .git/config,
      # where the external Axcess code could otherwise read it.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out latest Axcess
        uses: actions/checkout@v4
        with:
          repository: lsa-mis/axcess
          ref: main
          path: .axcess
          fetch-depth: 1
          persist-credentials: false

      - name: Record Axcess version
        run: |
          mkdir -p "$REPORT_DIR"
          # Keep Axcess's scan database, blobs and logs out of the workspace.
          # Each path is its own setting; AUDIT_DATA_DIR alone does not move the DB.
          data="$RUNNER_TEMP/axcess-data"
          {
            echo "AUDIT_DATA_DIR=$data"
            echo "AUDIT_DB_PATH=$data/audit.db"
            echo "AUDIT_BLOB_DIR=$data/blobs"
            echo "AUDIT_LOG_DIR=$data/logs"
          } >> "$GITHUB_ENV"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' .axcess/pyproject.toml | head -1)
          commit=$(git -C .axcess log -1 --format='%H')
          line="Axcess ${version} @ $(git -C .axcess log -1 --format='%h %s (%cd)')"
          echo "$line"
          printf 'version=%s\ncommit=%s\nref=%s\n' "$version" "$commit" main > "$REPORT_DIR/axcess-version.txt"
          echo "Scanned with **${line}** ([lsa-mis/axcess@${commit:0:7}](https://github.com/lsa-mis/axcess/commit/${commit}))" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

      # RAILS_MASTER_KEY is optional: every credential lookup is nil-safe, so
      # the app boots without it (SAML sign-in stays unconfigured). When the
      # secret exists it is given only to the two Rails steps below, never to
      # Axcess's steps.
      #
      # Accepted risk: the Rails server keeps the key in its environment while
      # Axcess runs, and any code on the same runner (Axcess or one of its
      # dependencies) can read another process's environment via /proc. The
      # key decrypts config/credentials.yml.enc, which holds staging and
      # production values. Leave the secret unset unless a scan needs
      # credentials; the public pages scanned here do not.
      - name: Report master key status
        env:
          HAS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY != '' }}
        run: |
          if [ "$HAS_MASTER_KEY" = "true" ]; then
            echo "::notice::RAILS_MASTER_KEY provided to the Rails steps only"
          else
            echo "::notice::No RAILS_MASTER_KEY secret; running with nil credentials (public pages only)"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare Rails database, sample data, and assets
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          bundle exec ruby -ractive_record -e 'ActiveRecord::Base.establish_connection(ENV.fetch("DATABASE_URL")); load "db/schema.rb"'
          bin/rails db:seed
          bin/rails runner script/ci/a11y_sample_data.rb
          bin/rails assets:precompile

      - name: Start Rails server
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          bin/rails server --environment test --port 3000 --binding 127.0.0.1 > log/ci-server.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS "$APP_URL/up" > /dev/null 2>&1; then
              echo "Rails is up at $APP_URL"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Rails server did not become ready within 90s"
          tail -n 100 log/ci-server.log
          exit 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: .axcess/uv.lock

      - name: Install Axcess and Chromium
        working-directory: .axcess
        run: |
          # Axcess's build force-includes its compiled web UI, which is not in
          # git. The CLI scan never serves the UI, so an empty folder suffices.
          mkdir -p src/audit/web/frontend/dist
          uv sync --frozen --no-dev
          uv run --no-sync playwright install --with-deps chromium
          # Create the scan database schema (what `make migrate` does).
          mkdir -p "$AUDIT_DATA_DIR"
          uv run --no-sync yoyo apply --database "sqlite:///$AUDIT_DB_PATH" --batch src/audit/db/migrations

      - name: Run Axcess scan
        working-directory: .axcess
        run: |
          uv run --no-sync audit crawl "$APP_URL/" \
            --max-pages "$AXCESS_MAX_PAGES" \
            --axe-level AA \
            --wcag-version 2.1 \
            --ignore-robots \
            --skip-ocr \
            --skip-vlm \
            --skip-synthesize \
            --skip-semantic \
            --block /export_to_csv \
            --block /users/auth \
            --block sign_out

      - name: Export Axcess reports
        working-directory: .axcess
        run: |
          for fmt in json markdown xlsx csv; do
            ext=$fmt; [ "$fmt" = markdown ] && ext=md
            uv run --no-sync audit export --format "$fmt" --output "$REPORT_DIR/axcess.$ext"
          done
          ls -la "$REPORT_DIR"

      - name: Upload Axcess report
        id: upload-report
        uses: actions/upload-artifact@v4
        with:
          name: axcess-accessibility-report
          path: reports/axcess/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize findings
        env:
          AXCESS_REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: ruby script/ci/axcess_report.rb "$REPORT_DIR/axcess.json"

      # Run even when the scan was incomplete (the summarize step exits 1), so
      # the uploaded report is still summarized and linked.
      - name: Append Axcess report to job summary
        if: ${{ !cancelled() && steps.upload-report.outcome == 'success' }}
        run: |
          report="$REPORT_DIR/axcess.md"
          # GitHub caps each step summary at 1 MiB.
          if [ "$(wc -c < "$report")" -lt 900000 ]; then
            { echo "<details><summary>Full Axcess report</summary>"; echo; cat "$report"; echo; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full Axcess report is too large for the job summary; download the artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Rails server log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rails-server-log
          path: log/ci-server.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Accessibility report link
        if: ${{ !cancelled() && steps.upload-report.outcome == 'success' }}
        env:
          AXCESS_REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: |
          echo "::notice title=Accessibility report::$AXCESS_REPORT_URL"
          echo "Accessibility report: $AXCESS_REPORT_URL"
